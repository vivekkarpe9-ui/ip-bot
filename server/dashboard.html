<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iP Bot Dashboard</title><style>body{margin:0;background:#071114;color:#edf7f5;font-family:system-ui;padding:18px}main{max-width:1050px;margin:auto}.card{background:#0d1b1f;border:1px solid #1b3338;border-radius:16px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.muted{color:#91aaa5}.ok{color:#21c77a}.bad{color:#ff6b6b}.warn{color:#ffc857}input,button{padding:11px;border-radius:10px;border:1px solid #29454b;background:#081519;color:#fff}button{background:#21c77a;color:#03100b;font-weight:800;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.item{border-top:1px solid #193036;padding:10px 0}.value{font-size:27px;font-weight:800}.hide{display:none}</style></head><body><main><h1>● iP Bot</h1><p class="muted">Owner • Agent • Approval • Wallet control</p><div class="card"><h2>Owner Login</h2><p class="muted">अपनी Vercel Production <b>OWNER_API_KEY</b> की exact value डालें। Key chat में साझा न करें।</p><div class="row"><input id="key" type="password" autocomplete="off" placeholder="OWNER_API_KEY" style="flex:1" onkeydown="if(event.key==='Enter')login()"><button id="connect" onclick="login()">Connect</button></div><p id="auth" class="muted">Disconnected</p></div><section id="panel" class="hide"><div class="grid"><div class="card"><span class="muted">API</span><div class="value ok">ONLINE</div></div><div class="card"><span class="muted">Approvals</span><div id="approvalCount" class="value">0</div></div><div class="card"><span class="muted">Jobs</span><div id="jobCount" class="value">0</div></div><div class="card"><span class="muted">Wallet Ledger</span><div id="balance" class="value">₹0</div></div></div><div class="card"><h2>Pending Agent Approvals</h2><div id="approvals">Loading…</div></div><div class="card"><h2>Recent Agent Jobs</h2><div id="jobs">Loading…</div></div><div class="card"><h2>Ledger</h2><div id="ledger">Loading…</div></div></section></main><script>let key='';async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json','x-owner-key':key,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||('HTTP '+r.status));e.status=r.status;throw e}return d}async function login(){const input=document.getElementById('key'),msg=document.getElementById('auth'),btn=document.getElementById('connect');key=input.value.trim();if(!key){msg.textContent='पहले OWNER_API_KEY डालें';msg.className='warn';return}btn.disabled=true;btn.textContent='Connecting…';msg.textContent='Server से connection check हो रहा है…';msg.className='muted';try{await fetch('/api/health',{cache:'no-store'}).then(async r=>{if(!r.ok)throw new Error('API health '+r.status);return r.json()});await api('/api/me',{cache:'no-store'});msg.textContent='Connected as Owner';msg.className='ok';document.getElementById('panel').classList.remove('hide');await load()}catch(e){msg.textContent=e.status===401?'Login failed: OWNER_API_KEY गलत है या Vercel में Production environment में उपलब्ध नहीं है.':'Connection failed: '+e.message;msg.className='bad'}finally{btn.disabled=false;btn.textContent='Connect'}}async function load(){try{const [a,j,l]=await Promise.all([api('/api/approvals'),api('/api/jobs'),api('/api/ledger')]);document.getElementById('approvalCount').textContent=a.length;document.getElementById('jobCount').textContent=j.length;document.getElementById('balance').textContent='₹'+l.reduce((s,x)=>s+(x.type==='credit'?Number(x.amount):-Number(x.amount)),0).toFixed(2);document.getElementById('approvals').innerHTML=a.length?a.map(x=>`<div class="item"><b>${x.type}</b> • ₹${x.amount} • ${x.status} <button onclick="decide('${x.id}','approved')">Approve</button> <button onclick="decide('${x.id}','rejected')">Reject</button></div>`).join(''):'No approvals';document.getElementById('jobs').innerHTML=j.length?j.slice(0,20).map(x=>`<div class="item"><b>${x.type}</b> • ${x.status} • ${new Date(x.created_at).toLocaleString()}</div>`).join(''):'No jobs';document.getElementById('ledger').innerHTML=l.length?l.slice(0,20).map(x=>`<div class="item">${x.type} • ₹${x.amount} ${x.currency} • ${x.reference||''}</div>`).join(''):'No ledger entries'}catch(e){document.getElementById('auth').textContent='Session error: '+e.message;document.getElementById('auth').className='bad'}}async function decide(id,d){try{await api('/api/approvals/'+id+'/'+d,{method:'POST'});await load()}catch(e){document.getElementById('auth').textContent='Action failed: '+e.message;document.getElementById('auth').className='bad'}}</script></body></html>
