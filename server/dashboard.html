<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iP Bot Dashboard</title><style>body{margin:0;background:#071114;color:#edf7f5;font-family:system-ui;padding:18px}main{max-width:1050px;margin:auto}.card{background:#0d1b1f;border:1px solid #1b3338;border-radius:16px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.muted{color:#91aaa5}.ok{color:#21c77a}.bad{color:#ff6b6b}.warn{color:#ffc857}input,button{padding:11px;border-radius:10px;border:1px solid #29454b;background:#081519;color:#fff}button{background:#21c77a;color:#03100b;font-weight:800;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.item{border-top:1px solid #193036;padding:10px 0}.value{font-size:27px;font-weight:800}.hide{display:none}</style></head><body><main><h1>● iP Bot</h1><p class="muted">Owner • Agent • Approval • Wallet control</p><div class="card"><h2>Owner Login</h2><p class="muted">अपनी Vercel Production <b>OWNER_API_KEY</b> की exact value डालें। Key chat में साझा न करें।</p><div class="row"><input id="key" type="password" autocomplete="off" placeholder="OWNER_API_KEY" style="flex:1"><button id="connect" type="button">Connect</button></div><p id="auth" class="muted">Disconnected</p></div><section id="panel" class="hide"><div class="grid"><div class="card"><span class="muted">API</span><div class="value ok">ONLINE</div></div><div class="card"><span class="muted">Approvals</span><div id="approvalCount" class="value">0</div></div><div class="card"><span class="muted">Jobs</span><div id="jobCount" class="value">0</div></div><div class="card"><span class="muted">Wallet Ledger</span><div id="balance" class="value">₹0</div></div></div><div class="card"><h2>Pending Agent Approvals</h2><div id="approvals">Loading…</div></div><div class="card"><h2>Recent Agent Jobs</h2><div id="jobs">Loading…</div></div><div class="card"><h2>Ledger</h2><div id="ledger">Loading…</div></div></section></main><script src="/dashboard.js" defer></script></body></html>
